<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1520"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MeasureLoom">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>MeasureLoom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dfe7ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17242d}.app{max-width:520px;min-height:100vh;margin:auto;background:#f4f7f8}.top{background:#fff;padding:18px;border-bottom:1px solid #dce4e7;position:sticky;top:0;z-index:5}.brand{font-size:24px;font-weight:900}.mark{border:3px solid #17242d;padding:0 5px;margin-right:5px}.blue{color:#1687d0}.tag{font-size:10px;color:#6b7880}.screen{padding:20px 16px 105px}.hide{display:none}h1{font-size:29px;margin:0 0 5px}.muted{color:#6b7880;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.tile,.card{background:#fff;border:1px solid #dce4e7;border-radius:16px;padding:15px}.tile{text-align:left;min-height:108px}.tile b{display:block;margin:9px 0 4px}.tile small{color:#6b7880}.card{margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{background:#e7f1f2;color:#167276;border-radius:20px;padding:6px 9px;font-size:10px;font-weight:800}.btn{width:100%;border:0;border-radius:11px;background:#167276;color:#fff;padding:13px;font-weight:800;margin:6px 0}.btn.alt{background:#e8eef0;color:#17242d}.btn.danger{background:#a33b3b}.back{border:0;background:none;color:#167276;font-weight:800;padding:0 0 10px}.field{margin:10px 0}.field label{display:block;font-size:10px;text-transform:uppercase;font-weight:900;color:#5d6a70;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd8dc;border-radius:10px;background:#fff;padding:11px;font-size:15px}.field textarea{min-height:75px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.measure{background:#f0f4f5;border-radius:12px;padding:12px;margin:10px 0}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #e8edef;font-size:13px}.empty{text-align:center;padding:24px 8px;color:#6b7880}.smallbtn{border:0;background:#e8eef0;border-radius:8px;padding:7px 9px;font-weight:800}.actions{display:flex;gap:6px}.actions>*{flex:1}.total{font-size:22px;font-weight:900;padding:12px 0}.photo{border:2px dashed #c5d1d5;border-radius:12px;padding:18px;text-align:center;margin:10px 0}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0b1520;color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:20;white-space:nowrap}
</style></head><body><div class="app">
<header class="top"><div class="brand"><span class="mark">M</span>Measure<span class="blue">Loom</span></div><div class="tag">Measure Smarter. Install Better.</div></header>

<section id="home" class="screen"><h1>Dashboard</h1><div class="muted" id="company"></div><div class="grid">
<button class="tile" onclick="newProject()">📐<b>New Project</b><small>Start a measurement job</small></button>
<button class="tile" onclick="show('projects')">🗂️<b>Projects</b><small>Your jobs</small></button>
<button class="tile" onclick="show('customers')">👤<b>Customers</b><small>Contacts</small></button>
<button class="tile" onclick="show('tracking')">🚚<b>Orders</b><small>Shipments</small></button>
<button class="tile" onclick="show('estimates')">💰<b>Estimates</b><small>Quotes</small></button>
<button class="tile" onclick="show('invoices')">🧾<b>Invoices</b><small>Payments</small></button></div>
<div class="card"><div class="row"><b>Today's Work</b><span class="pill" id="count">0 active</span></div><div id="today"></div></div></section>

<section id="projects" class="screen hide"><button class="back" onclick="show('home')">← Dashboard</button><div class="row"><h1>Projects</h1><button class="smallbtn" onclick="newProject()">＋</button></div><div id="projectList"></div></section>
<section id="project" class="screen hide"><button class="back" onclick="show('projects')">← Projects</button><div id="projectView"></div></section>
<section id="new" class="screen hide"><button class="back" onclick="show('projects')">← Projects</button><h1>New Project</h1><div class="card">
<div class="field"><label>Customer</label><input id="pc" placeholder="Customer name"></div><div class="field"><label>Job Address</label><input id="pa" placeholder="Address"></div><div class="field"><label>Job Number</label><input id="pj" placeholder="Optional"></div><button class="btn" onclick="createProject()">Create Project</button></div></section>
<section id="measure" class="screen hide"><button class="back" onclick="openProject(curP)">← Project</button><div id="measureView"></div></section>
<section id="drapery" class="screen hide"><button class="back" onclick="show('measure')">← Measurement</button><h1>Drapery Measure</h1><div class="card">
<div class="field"><label>Ceiling → Top of Window</label><input id="dc" inputmode="decimal"></div><div class="field"><label>Bottom of Window → Floor</label><input id="df" inputmode="decimal"></div><div class="field"><label>Window Width</label><input id="dw" inputmode="decimal"></div><div class="field"><label>Window Height</label><input id="dh" inputmode="decimal"></div><div class="two"><div class="field"><label>Left Obstruction</label><input id="dl" inputmode="decimal"></div><div class="field"><label>Right Obstruction</label><input id="dr" inputmode="decimal"></div></div><div class="field"><label>Notes</label><textarea id="dn"></textarea></div><button class="btn" onclick="saveDrapery()">Save Drapery Measure</button></div></section>
<section id="customers" class="screen hide"><button class="back" onclick="show('home')">← Dashboard</button><h1>Customers</h1><div class="card"><div class="field"><label>Name</label><input id="cn"></div><div class="two"><div class="field"><label>Phone</label><input id="cp" inputmode="tel"></div><div class="field"><label>Email</label><input id="ce" type="email"></div></div><button class="btn" onclick="addCustomer()">Add Customer</button></div><div id="customerList"></div></section>
<section id="tracking" class="screen hide"><button class="back" onclick="show('home')">← Dashboard</button><div class="row"><h1>Order Tracking</h1><button class="smallbtn" onclick="addShipment()">＋</button></div><div id="shipList"></div></section>
<section id="estimates" class="screen hide"><button class="back" onclick="show('home')">← Dashboard</button><h1>Estimates</h1><div class="card"><div class="field"><label>Project</label><select id="ep"></select></div><div id="lines"></div><button class="btn alt" onclick="addLine()">＋ Add Line Item</button><div class="total" id="etotal">$0.00</div><button class="btn" onclick="saveEstimate()">Save Estimate</button></div><div id="estimateList"></div></section>
<section id="invoices" class="screen hide"><button class="back" onclick="show('home')">← Dashboard</button><h1>Invoices</h1><div class="card"><div class="two"><div class="field"><label>Invoice #</label><input id="inum" placeholder="INV-1001"></div><div class="field"><label>Amount</label><input id="iamt" inputmode="decimal"></div></div><div class="field"><label>Payment Terms</label><select id="it"><option>Due upon completion</option><option>Net 7</option><option>Net 15</option><option>Net 30</option></select></div><button class="btn" onclick="saveInvoice()">Save Invoice</button></div><div id="invoiceList"></div></section>

<nav class="nav"><button onclick="show('home')"><b>⌂</b>Home</button><button onclick="show('projects')"><b>▣</b>Projects</button><button onclick="show('projects')"><b>📐</b>Measure</button><button onclick="show('tracking')"><b>🚚</b>Orders</button><button onclick="show('estimates')"><b>💵</b>Money</button></nav></div><div id="toast" class="toast"></div>

<script>
const $=id=>document.getElementById(id);const KEY='measureloom_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[],customers:[],shipments:[],estimates:[],invoices:[],settings:{company:'Carlisle Blinds & Installations LLC'}};let curP=null,curO=null,lines=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const toast=s=>{let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>t.style.display='none',1500)};const money=n=>'$'+Number(n||0).toFixed(2);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('hide',x.id!==id));render();scrollTo(0,0)}
function newProject(){['pc','pa','pj'].forEach(x=>$(x).value='');show('new')}
function createProject(){let p={id:crypto.randomUUID(),customer:$('pc').value.trim()||'New Customer',address:$('pa').value.trim(),job:$('pj').value.trim(),status:'Measure',openings:[],created:Date.now()};db.projects.unshift(p);curP=p.id;save();openProject(p.id)}
function openProject(id){curP=id;show('project')}
function deleteProject(id){if(confirm('Delete this project?')){db.projects=db.projects.filter(p=>p.id!==id);save();show('projects')}}
function addOpening(){let p=db.projects.find(x=>x.id===curP);if(!p)return;let o={id:crypto.randomUUID(),room:'',product:'Roller Shade',width:{top:'',middle:'',bottom:''},height:{left:'',center:'',right:''},notes:'',drapery:null};p.openings.push(o);curO=o.id;save();show('measure')}
function deleteOpening(id){let p=db.projects.find(x=>x.id===curP);if(p&&confirm('Delete this opening?')){p.openings=p.openings.filter(o=>o.id!==id);save();show('project')}}
const products=['Roller Shade','Zebra Shade','Vertical Blind','Sheer','Roman Shade','Cellular Shade','Wood Blind','Faux Wood Blind','Shutter','Drapery'];
function measureHTML(o){let topOnly=['Roller Shade','Zebra Shade','Vertical Blind','Sheer'].includes(o.product),w=topOnly?'<div class="field"><label>Width • Top</label><input id="wt" inputmode="decimal" value="'+esc(o.width.top)+'"></div>':'<div class="three">'+['top','middle','bottom'].map(k=>'<div class="field"><label>Width • '+k+'</label><input id="w'+k+'" inputmode="decimal" value="'+esc(o.width[k])+'"></div>').join('')+'</div>';return w+'<div class="measure"><b>Height • Always Left / Center / Right</b><div class="three">'+['left','center','right'].map(k=>'<div class="field"><label>'+k+'</label><input id="h'+k+'" inputmode="decimal" value="'+esc(o.height[k])+'"></div>').join('')+'</div></div>'}
function renderMeasure(){let e=document.getElementById('measureView'),p=db.projects.find(x=>x.id===curP),o=p?.openings.find(x=>x.id===curO);if(!p||!o){e.innerHTML='<h1>Measure</h1><div class="empty">Add an opening from a project.</div>';return}e.innerHTML='<div class="row"><h1>Opening '+String(p.openings.indexOf(o)+1).padStart(2,'0')+'</h1><span class="pill">'+esc(o.product)+'</span></div><div class="muted">'+esc(p.customer)+'</div><div class="field"><label>Room</label><input id="room" value="'+esc(o.room)+'" placeholder="Living Room"></div><div class="field"><label>Product</label><select id="prod" onchange="changeProduct()">'+products.map(x=>'<option '+(x===o.product?'selected':'')+'>'+x+'</option>').join('')+'</select></div>'+measureHTML(o)+'<div class="field"><label>Notes</label><textarea id="notes">'+esc(o.notes)+'</textarea></div><div class="photo">📷<br><b>Photo capture</b><br><small class="muted">Native camera integration is next.</small></div><button class="btn" onclick="saveOpening()">Save Measurement</button><button class="btn alt" onclick="saveOpening();show('drapery')">Drapery Measure</button><button class="btn danger" onclick="deleteOpening(\\''+o.id+'\\')">Delete Opening</button>'}
function changeProduct(){let p=db.projects.find(x=>x.id===curP),o=p.openings.find(x=>x.id===curO);o.product=document.getElementById('prod').value;renderMeasure()}
function saveOpening(){let p=db.projects.find(x=>x.id===curP),o=p?.openings.find(x=>x.id===curO);if(!o)return;o.room=document.getElementById('room').value;o.product=document.getElementById('prod').value;o.notes=document.getElementById('notes').value;o.width.top=document.getElementById('wTop')?.value||document.getElementById('wt')?.value||'';o.width.middle=document.getElementById('wmiddle')?.value||'';o.width.bottom=document.getElementById('wbottom')?.value||'';o.height.left=document.getElementById('hleft')?.value||'';o.height.center=document.getElementById('hcenter')?.value||'';o.height.right=document.getElementById('hright')?.value||'';save();toast('Measurement saved ✓')}
function saveDrapery(){let p=db.projects.find(x=>x.id===curP),o=p?.openings.find(x=>x.id===curO);if(!o)return;o.drapery={ceiling:$('dc').value,floor:$('df').value,width:$('dw').value,height:$('dh').value,left:$('dl').value,right:$('dr').value,notes:$('dn').value};save();toast('Drapery saved ✓');show('measure')}
function renderProject(){let e=document.getElementById('projectView'),p=db.projects.find(x=>x.id===curP);if(!p){e.innerHTML='';return}e.innerHTML='<div class="row"><h1>'+esc(p.customer)+'</h1><span class="pill">'+p.openings.length+' openings</span></div><div class="muted">'+esc(p.address)+' '+esc(p.job)+'</div><div class="card"><button class="btn" onclick="addOpening()">＋ Add Opening</button></div>'+(p.openings.length?p.openings.map((o,i)=>'<div class="card"><div class="row"><b>'+String(i+1).padStart(2,'0')+' • '+esc(o.room||'Unnamed')+'</b><span class="pill">'+esc(o.product)+'</span></div><div class="muted">W '+esc(o.width.top||o.width.middle||'—')+' • H '+esc(o.height.left||'—')+'</div><div class="actions"><button class="smallbtn" onclick="curO=\\''+o.id+'\\';show(\\'measure\\')">Edit</button><button class="smallbtn" onclick="deleteOpening(\\''+o.id+'\\')">Delete</button></div></div>').join(''):'<div class="empty">No openings yet.</div>')+'<button class="btn danger" onclick="deleteProject(\\''+p.id+'\\')">Delete Project</button>'}
function renderProjects(){let e=document.getElementById('projectList');e.innerHTML=db.projects.length?db.projects.map(p=>'<div class="card"><div class="row"><b>'+esc(p.customer)+'</b><span class="pill">'+p.openings.length+' openings</span></div><div class="muted">'+esc(p.address||'No address')+'</div><div class="status">'+esc(p.status)+'</div><button class="btn alt" onclick="openProject(\\''+p.id+'\\')">Open Project</button></div>').join(''):'<div class="empty">No projects yet. Tap ＋ to create your first one.</div>'}
function addCustomer(){let n=$('cn').value.trim();if(!n)return toast('Enter a customer name');db.customers.unshift({id:crypto.randomUUID(),name:n,phone:$('cp').value,email:$('ce').value});$('cn').value='';$('cp').value='';$('ce').value='';save();toast('Customer added ✓')}
function delCustomer(id){if(confirm('Delete this customer?')){db.customers=db.customers.filter(x=>x.id!==id);save()}}
function renderCustomers(){$('customerList').innerHTML=db.customers.length?db.customers.map(c=>'<div class="card"><div class="row"><b>'+esc(c.name)+'</b><button class="smallbtn" onclick="delCustomer(\\''+c.id+'\\')">Delete</button></div><div class="muted">'+esc(c.phone)+' '+esc(c.email)+'</div></div>').join(''):'<div class="empty">No customers yet.</div>'}
function addShipment(){let v=prompt('Vendor / manufacturer');if(!v)return;db.shipments.unshift({id:crypto.randomUUID(),vendor:v,order:prompt('Order number')||'',tracking:prompt('Tracking number')||'',status:'Ordered'});save();toast('Shipment added ✓')}
function delShipment(id){if(confirm('Delete shipment?')){db.shipments=db.shipments.filter(x=>x.id!==id);save()}}
function nextShip(id){let s=db.shipments.find(x=>x.id===id),a=['Ordered','In Transit','Delivered'];if(s){s.status=a[Math.min(a.indexOf(s.status)+1,2)];save();toast('Status updated ✓')}}
function renderShips(){$('shipList').innerHTML=db.shipments.length?db.shipments.map(s=>'<div class="card"><div class="row"><b>'+esc(s.vendor)+'</b><span class="pill">'+esc(s.status)+'</span></div><div class="muted">Order '+esc(s.order)+' • '+esc(s.tracking||'No tracking')+'</div><div class="actions"><button class="smallbtn" onclick="nextShip(\\''+s.id+'\\')">Update</button><button class="smallbtn" onclick="delShipment(\\''+s.id+'\\')">Delete</button></div></div>').join(''):'<div class="empty">No shipments yet.</div>'}
function addLine(){lines.push({description:'',qty:1,price:0});renderLines()}
function renderLines(){lines=lines.length?lines:[{description:'',qty:1,price:0}];$('lines').innerHTML=lines.map((l,i)=>'<div class="card"><div class="field"><label>Description</label><input value="'+esc(l.description)+'" oninput="lines['+i+'].description=this.value"></div><div class="two"><div class="field"><label>Qty</label><input inputmode="decimal" value="'+l.qty+'" oninput="lines['+i+'].qty=Number(this.value)||0;calc()"></div><div class="field"><label>Unit Price</label><input inputmode="decimal" value="'+l.price+'" oninput="lines['+i+'].price=Number(this.value)||0;calc()"></div></div><button class="smallbtn" onclick="lines.splice('+i+',1);renderLines()">Delete Line</button></div>').join('');calc()}
function calc(){let n=lines.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.price)||0),0);$('etotal').textContent=money(n)}
function saveEstimate(){let valid=lines.filter(l=>l.description||l.price);if(!valid.length)return toast('Add a line item');let total=valid.reduce((a,l)=>a+l.qty*l.price,0);db.estimates.unshift({id:crypto.randomUUID(),projectId:$('ep').value,lines:valid,total,status:'Draft'});save();lines=[];renderLines();toast('Estimate saved ✓')}
function delEstimate(id){if(confirm('Delete estimate?')){db.estimates=db.estimates.filter(x=>x.id!==id);save()}}
function renderEstimates(){$('ep').innerHTML=db.projects.length?db.projects.map(p=>'<option value="'+p.id+'">'+esc(p.customer)+'</option>').join(''):'<option>No projects</option>';$('estimateList').innerHTML=db.estimates.length?db.estimates.map(e=>'<div class="card"><div class="row"><b>Estimate</b><span class="pill">'+esc(e.status)+'</span></div><div class="muted">'+esc(db.projects.find(p=>p.id===e.projectId)?.customer||'Project')+'</div><div class="total">'+money(e.total)+'</div><button class="smallbtn" onclick="delEstimate(\\''+e.id+'\\')">Delete</button></div>').join(''):'<div class="empty">No estimates yet.</div>'}
function saveInvoice(){db.invoices.unshift({id:crypto.randomUUID(),number:$('inum').value.trim()||'INV-'+Date.now(),amount:Number($('iamt').value)||0,terms:$('it').value,paid:0});save();toast('Invoice saved ✓')}
function pay(id){let i=db.invoices.find(x=>x.id===id),a=Number(prompt('Payment amount',String(Math.max(0,i.amount-i.paid))));if(a>0){i.paid=Math.min(i.amount,i.paid+a);save();toast('Payment recorded ✓')}}
function delInvoice(id){if(confirm('Delete invoice?')){db.invoices=db.invoices.filter(x=>x.id!==id);save()}}
function renderInvoices(){$('invoiceList').innerHTML=db.invoices.length?db.invoices.map(i=>'<div class="card"><div class="row"><b>'+esc(i.number)+'</b><span class="pill">'+(i.paid>=i.amount?'Paid':'Balance Due')+'</span></div><div class="line"><span>Total</span><b>'+money(i.amount)+'</b></div><div class="line"><span>Paid</span><b>'+money(i.paid)+'</b></div><div class="line"><span>Remaining</span><b>'+money(Math.max(0,i.amount-i.paid))+'</b></div><div class="muted">'+esc(i.terms)+'</div><div class="actions"><button class="smallbtn" onclick="pay(\\''+i.id+'\\')">Record Payment</button><button class="smallbtn" onclick="delInvoice(\\''+i.id+'\\')">Delete</button></div></div>').join(''):'<div class="empty">No invoices yet.</div>'}
function renderHome(){$('company').textContent=db.settings.company;$('count').textContent=db.projects.length+' active';$('today').innerHTML=db.projects.length?db.projects.slice(0,5).map(p=>'<div class="line"><span>'+esc(p.customer)+'</span><b>'+esc(p.status)+'</b></div>').join(''):'<div class="empty">No jobs yet. Your dashboard is clean and ready. 📐</div>'}
function render(){renderHome();renderProjects();renderProject();renderMeasure();renderCustomers();renderShips();renderEstimates();renderInvoices()}
render();renderLines();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
